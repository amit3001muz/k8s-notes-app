name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: github-self

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Backend Image
      run: |
        docker build -t amit3001muz/notes-backend:latest ./backend
        docker push amit3001muz/notes-backend:latest

    - name: Build Frontend Image
      run: |
        docker build -t amit3001muz/notes-frontend:latest ./frontend
        docker push amit3001muz/notes-frontend:latest

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s/    